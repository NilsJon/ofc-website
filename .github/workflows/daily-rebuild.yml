name: Daily exhibition state rebuild

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages build when configured
        env:
          CLOUDFLARE_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$CLOUDFLARE_DEPLOY_HOOK_URL" ]; then
            echo 'Deploy hook not configured; skipping.'
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$CLOUDFLARE_DEPLOY_HOOK_URL"
